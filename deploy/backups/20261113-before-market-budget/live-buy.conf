[Service]
Environment=QUOTE_TRADE_ENV_FILE=/root/workspace/dqdhook/.env
Environment=QUOTE_LIVE=1
Environment=QUOTE_SCORE_MODE=live
Environment=QUOTE_PROP_MODE=live
Environment=QUOTE_FT_MODE=live
Environment=QUOTE_MAX_USDC=1
Environment=QUOTE_MAX_SHARES=2
Environment=QUOTE_MAX_OPEN_USDC=1
Environment=QUOTE_SIZE_FLOOR_USDC=1
Environment=QUOTE_REST_ENABLED=0
Environment=QUOTE_ALLOW_EXTREME_PRICES=0
Environment=QUOTE_TAKE_DEPTH=top
ExecStart=
ExecStart=/root/workspace/dqdbasketball/.venv/bin/python /root/workspace/dqdbasketball/frontend/run_main.py --no-browser --live --take-depth top --max-usdc 1 --max-shares 2 --min-buy-price 0.92
